name: Action-based workflow
on: 
  push:

jobs:
  action-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - name: Install dependencies
        run: npm Ci
        working-directory: Action-GA/react-app
      