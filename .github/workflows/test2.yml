name: Workflow event
on: 
  push:
  pull_request:
  schedule:
    - cron: '0/5 * * * *'  # Runs every 5 minutes
  workflow_dispatch:
jobs:
  workflow-job:
    runs-on: ubuntu-latest
    steps:
      - name: Echo a message
        run: echo "I have been triggered by a ${{ github.event_name }} event!"